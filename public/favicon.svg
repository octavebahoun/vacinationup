<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background premium gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />    <!-- Indigo -->
      <stop offset="50%" stop-color="#4f46e5" />   <!-- Deep Indigo -->
      <stop offset="100%" stop-color="#06b6d4" />  <!-- Cyan -->
    </linearGradient>
    
    <!-- Accent gradient for the child element -->
    <linearGradient id="babyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />    <!-- Pink -->
      <stop offset="100%" stop-color="#facc15" />   <!-- Yellow/Gold -->
    </linearGradient>

    <!-- Drop shadow for the medical cross and heart -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#090d16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular background representing protection/shield -->
  <circle cx="256" cy="256" r="240" fill="url(#mainGrad)" />

  <!-- Outer ring representing vaccination cycle/immunity -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ffffff" stroke-width="12" stroke-dasharray="20 15" opacity="0.35" />

  <!-- Shield + Heart Protection Shape in white with shadow -->
  <path d="M256,95 C280,95 380,105 380,215 C380,315 285,385 256,415 C227,385 132,315 132,215 C132,105 232,95 256,95 Z" 
        fill="#ffffff" 
        filter="url(#glow)" />

  <!-- Stylized child (mother care) inside the heart/shield -->
  <!-- Medical Cross embedded in the shield (top right) -->
  <path d="M305,145 H325 V165 H305 Z M295,155 H335 V155 H295 Z" 
        stroke="url(#mainGrad)" 
        stroke-width="8" 
        stroke-linecap="round" />

  <!-- Child/Infant Silhouette -->
  <!-- Head -->
  <circle cx="256" cy="210" r="32" fill="url(#mainGrad)" />
  
  <!-- Swaddled baby/body -->
  <path d="M256,255 C216,255 192,280 192,325 C192,350 220,365 256,365 C292,365 320,350 320,325 C320,280 296,255 256,255 Z" 
        fill="url(#mainGrad)" />

  <!-- Heart detailing inside the baby's swaddle -->
  <path d="M256,295 C262,288 274,288 280,295 C286,302 274,318 256,330 C238,318 226,302 232,295 C238,288 250,288 256,295 Z" 
        fill="#ffffff" />
        
  <!-- Sparkles of health and energy -->
  <path d="M175,170 L178,178 L186,179 L180,185 L181,193 L175,188 L169,193 L170,185 L164,179 L172,178 Z" fill="#eab308" />
  <path d="M335,270 L337,275 L342,276 L338,280 L339,285 L335,282 L331,285 L332,280 L328,276 L333,275 Z" fill="#22c55e" />
</svg>